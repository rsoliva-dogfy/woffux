name: Auto Sign

on:
  schedule:
    - cron: '16 11 * * 1,2'  # Mon-Tue 13:16 (UTC+2)
    - cron: '16 12 * * 1,2'  # Mon-Tue 13:16 (UTC+1)
    - cron: '16 6 * * 5'  # Fri 08:16 (UTC+2)
    - cron: '16 7 * * 5'  # Fri 08:16 (UTC+1)
    - cron: '2 11 * * 3'  # Wed 13:02 (UTC+2)
    - cron: '2 12 * * 3'  # Wed 13:02 (UTC+1)
    - cron: '21 6 * * 3'  # Wed 08:21 (UTC+2)
    - cron: '21 7 * * 3'  # Wed 08:21 (UTC+1)
    - cron: '23 12 * * 4'  # Thu 14:23 (UTC+2)
    - cron: '23 12 * * 5'  # Fri 14:23 (UTC+2)
    - cron: '23 13 * * 4'  # Thu 14:23 (UTC+1)
    - cron: '23 13 * * 5'  # Fri 14:23 (UTC+1)
    - cron: '28 15 * * 1,3'  # Mon-Wed 17:28 (UTC+2)
    - cron: '28 16 * * 1,3'  # Mon-Wed 17:28 (UTC+1)
    - cron: '32 6 * * 1'  # Mon 08:32 (UTC+2)
    - cron: '32 7 * * 1'  # Mon 08:32 (UTC+1)
    - cron: '34 11 * * 3'  # Wed 13:34 (UTC+2)
    - cron: '34 12 * * 3'  # Wed 13:34 (UTC+1)
    - cron: '39 15 * * 2'  # Tue 17:39 (UTC+2)
    - cron: '39 16 * * 2'  # Tue 17:39 (UTC+1)
    - cron: '42 11 * * 1'  # Mon 13:42 (UTC+2)
    - cron: '42 12 * * 1'  # Mon 13:42 (UTC+1)
    - cron: '42 6 * * 2'  # Tue 08:42 (UTC+2)
    - cron: '42 7 * * 2'  # Tue 08:42 (UTC+1)
    - cron: '46 15 * * 4'  # Thu 17:46 (UTC+2)
    - cron: '46 16 * * 4'  # Thu 17:46 (UTC+1)
    - cron: '48 6 * * 4'  # Thu 08:48 (UTC+2)
    - cron: '48 7 * * 4'  # Thu 08:48 (UTC+1)
    - cron: '51 11 * * 2'  # Tue 13:51 (UTC+2)
    - cron: '51 12 * * 2'  # Tue 13:51 (UTC+1)
    - cron: '52 11 * * 4'  # Thu 13:52 (UTC+2)
    - cron: '52 12 * * 4'  # Thu 13:52 (UTC+1)
    - cron: '7,22,37,52 7-18 * * 1,2,3,4,5'  # catch-up every 15m (UTC+1)
    - cron: '7,22,37,52 6-17 * * 1,2,3,4,5'  # catch-up every 15m (UTC+2)
  workflow_dispatch:


concurrency:
  group: sign
  cancel-in-progress: true

jobs:
  sign:
    name: Sign in Woffu
    runs-on: ubuntu-latest
    steps:

      - name: Download woffux
        run: |
          curl -fsSL "https://github.com/ngavilan-dogfy/woffux/releases/latest/download/woffux-linux-amd64" -o woffux
          chmod +x woffux

      - name: Random delay
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 90 + 1 ))

      - name: Sign
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ./woffux sign --catch-up '1:08:32:in;1:13:16:out;1:13:42:in;1:17:28:out;2:08:42:in;2:13:16:out;2:13:51:in;2:17:39:out;3:08:21:in;3:13:02:out;3:13:34:in;3:17:28:out;4:08:48:in;4:13:52:out;4:14:23:in;4:17:46:out;5:08:16:in;5:14:23:out' --catch-up-timezone 'Europe/Madrid' --catch-up-window '2h'
          else
            ./woffux sign
          fi
        env:
          WOFFU_URL: ${{ secrets.WOFFU_URL }}
          WOFFU_COMPANY_URL: ${{ secrets.WOFFU_COMPANY_URL }}
          WOFFU_EMAIL: ${{ secrets.WOFFU_EMAIL }}
          WOFFU_PASSWORD: ${{ secrets.WOFFU_PASSWORD }}
          WOFFU_LATITUDE: ${{ secrets.WOFFU_LATITUDE }}
          WOFFU_LONGITUDE: ${{ secrets.WOFFU_LONGITUDE }}
          WOFFU_HOME_LATITUDE: ${{ secrets.WOFFU_HOME_LATITUDE }}
          WOFFU_HOME_LONGITUDE: ${{ secrets.WOFFU_HOME_LONGITUDE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Notify failure
        if: failure()
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MSG="❌ woffux auto-sign failed at $(TZ=Europe/Madrid date '+%H:%M %Z %Y-%m-%d')"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d text="${MSG}" > /dev/null
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
