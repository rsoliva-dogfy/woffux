name: Auto Sign

on:
  schedule:
    - cron: '1 16 * * 2'  # Tue 18:01 (UTC+2)
    - cron: '1 17 * * 2'  # Tue 18:01 (UTC+1)
    - cron: '12 11 * * 1,3'  # Mon-Wed 13:12 (UTC+2)
    - cron: '12 12 * * 1,3'  # Mon-Wed 13:12 (UTC+1)
    - cron: '12 6 * * 5'  # Fri 08:12 (UTC+2)
    - cron: '12 7 * * 5'  # Fri 08:12 (UTC+1)
    - cron: '18 12 * * 5'  # Fri 14:18 (UTC+2)
    - cron: '18 13 * * 5'  # Fri 14:18 (UTC+1)
    - cron: '21 11 * * 2'  # Tue 13:21 (UTC+2)
    - cron: '21 12 * * 2'  # Tue 13:21 (UTC+1)
    - cron: '22 6 * * 1'  # Mon 08:22 (UTC+2)
    - cron: '22 7 * * 1'  # Mon 08:22 (UTC+1)
    - cron: '36 11 * * 4'  # Thu 13:36 (UTC+2)
    - cron: '36 12 * * 4'  # Thu 13:36 (UTC+1)
    - cron: '36 6 * * 4'  # Thu 08:36 (UTC+2)
    - cron: '36 7 * * 4'  # Thu 08:36 (UTC+1)
    - cron: '38 11 * * 1'  # Mon 13:38 (UTC+2)
    - cron: '38 12 * * 1'  # Mon 13:38 (UTC+1)
    - cron: '39 6 * * 3'  # Wed 08:39 (UTC+2)
    - cron: '39 7 * * 3'  # Wed 08:39 (UTC+1)
    - cron: '45 6 * * 2'  # Tue 08:45 (UTC+2)
    - cron: '45 7 * * 2'  # Tue 08:45 (UTC+1)
    - cron: '49 11 * * 3'  # Wed 13:49 (UTC+2)
    - cron: '49 12 * * 3'  # Wed 13:49 (UTC+1)
    - cron: '50 15 * * 1'  # Mon 17:50 (UTC+2)
    - cron: '50 16 * * 1'  # Mon 17:50 (UTC+1)
    - cron: '52 15 * * 3,4'  # Wed-Thu 17:52 (UTC+2)
    - cron: '52 16 * * 3,4'  # Wed-Thu 17:52 (UTC+1)
    - cron: '53 11 * * 2'  # Tue 13:53 (UTC+2)
    - cron: '53 12 * * 2'  # Tue 13:53 (UTC+1)
    - cron: '59 11 * * 4'  # Thu 13:59 (UTC+2)
    - cron: '59 12 * * 4'  # Thu 13:59 (UTC+1)
    - cron: '7,22,37,52 7-19 * * 1,2,3,4,5'  # catch-up every 15m (UTC+1)
    - cron: '7,22,37,52 6-18 * * 1,2,3,4,5'  # catch-up every 15m (UTC+2)
  workflow_dispatch:


concurrency:
  group: sign
  cancel-in-progress: true

jobs:
  sign:
    name: Sign in Woffu
    runs-on: ubuntu-latest
    steps:

      - name: Download woffux
        run: |
          curl -fsSL "https://github.com/ngavilan-dogfy/woffux/releases/latest/download/woffux-linux-amd64" -o woffux
          chmod +x woffux

      - name: Random delay
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 90 + 1 ))

      - name: Sign
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ./woffux sign --catch-up '1:08:22:in;1:13:12:out;1:13:38:in;1:17:50:out;2:08:45:in;2:13:21:out;2:13:53:in;2:18:01:out;3:08:39:in;3:13:12:out;3:13:49:in;3:17:52:out;4:08:36:in;4:13:36:out;4:13:59:in;4:17:52:out;5:08:12:in;5:14:18:out' --catch-up-timezone 'Europe/Madrid' --catch-up-window '2h'
          else
            ./woffux sign
          fi
        env:
          WOFFU_URL: ${{ secrets.WOFFU_URL }}
          WOFFU_COMPANY_URL: ${{ secrets.WOFFU_COMPANY_URL }}
          WOFFU_EMAIL: ${{ secrets.WOFFU_EMAIL }}
          WOFFU_PASSWORD: ${{ secrets.WOFFU_PASSWORD }}
          WOFFU_LATITUDE: ${{ secrets.WOFFU_LATITUDE }}
          WOFFU_LONGITUDE: ${{ secrets.WOFFU_LONGITUDE }}
          WOFFU_HOME_LATITUDE: ${{ secrets.WOFFU_HOME_LATITUDE }}
          WOFFU_HOME_LONGITUDE: ${{ secrets.WOFFU_HOME_LONGITUDE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Notify failure
        if: failure()
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MSG="❌ woffux auto-sign failed at $(TZ=Europe/Madrid date '+%H:%M %Z %Y-%m-%d')"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d text="${MSG}" > /dev/null
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
