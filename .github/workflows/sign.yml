name: Auto Sign

on:
  schedule:
    - cron: '0 13 * * 5'  # Fri 15:00 (UTC+2)
    - cron: '0 14 * * 5'  # Fri 15:00 (UTC+1)
    - cron: '0 7 * * 5'  # Fri 09:00 (UTC+2)
    - cron: '0 8 * * 5'  # Fri 09:00 (UTC+1)
    - cron: '1 7 * * 1,3'  # Mon-Wed 09:01 (UTC+2)
    - cron: '1 8 * * 1,3'  # Mon-Wed 09:01 (UTC+1)
    - cron: '19 11 * * 2,4'  # Tue-Thu 13:19 (UTC+2)
    - cron: '19 12 * * 2,4'  # Tue-Thu 13:19 (UTC+1)
    - cron: '2 16 * * 1,3'  # Mon-Wed 18:02 (UTC+2)
    - cron: '2 17 * * 1,3'  # Mon-Wed 18:02 (UTC+1)
    - cron: '23 11 * * 1,3'  # Mon-Wed 13:23 (UTC+2)
    - cron: '23 12 * * 1,3'  # Mon-Wed 13:23 (UTC+1)
    - cron: '40 11 * * 2,4'  # Tue-Thu 13:40 (UTC+2)
    - cron: '40 12 * * 2,4'  # Tue-Thu 13:40 (UTC+1)
    - cron: '54 11 * * 1,3'  # Mon-Wed 13:54 (UTC+2)
    - cron: '54 12 * * 1,3'  # Mon-Wed 13:54 (UTC+1)
    - cron: '55 6 * * 2,4'  # Tue-Thu 08:55 (UTC+2)
    - cron: '55 7 * * 2,4'  # Tue-Thu 08:55 (UTC+1)
    - cron: '59 15 * * 2,4'  # Tue-Thu 17:59 (UTC+2)
    - cron: '59 16 * * 2,4'  # Tue-Thu 17:59 (UTC+1)
    - cron: '7,22,37,52 7-19 * * 1,2,3,4,5'  # catch-up every 15m (UTC+1)
    - cron: '7,22,37,52 6-18 * * 1,2,3,4,5'  # catch-up every 15m (UTC+2)
  workflow_dispatch:


concurrency:
  group: sign
  cancel-in-progress: true

jobs:
  sign:
    name: Sign in Woffu
    runs-on: ubuntu-latest
    steps:

      - name: Download woffux
        run: |
          curl -fsSL "https://github.com/ngavilan-dogfy/woffux/releases/latest/download/woffux-linux-amd64" -o woffux
          chmod +x woffux

      - name: Random delay
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 90 + 1 ))

      - name: Sign
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ./woffux sign --catch-up '1:09:01:in;1:13:23:out;1:13:54:in;1:18:02:out;2:08:55:in;2:13:19:out;2:13:40:in;2:17:59:out;3:09:01:in;3:13:23:out;3:13:54:in;3:18:02:out;4:08:55:in;4:13:19:out;4:13:40:in;4:17:59:out;5:09:00:in;5:15:00:out' --catch-up-timezone 'Europe/Madrid' --catch-up-window '2h'
          else
            ./woffux sign
          fi
        env:
          WOFFU_URL: ${{ secrets.WOFFU_URL }}
          WOFFU_COMPANY_URL: ${{ secrets.WOFFU_COMPANY_URL }}
          WOFFU_EMAIL: ${{ secrets.WOFFU_EMAIL }}
          WOFFU_PASSWORD: ${{ secrets.WOFFU_PASSWORD }}
          WOFFU_LATITUDE: ${{ secrets.WOFFU_LATITUDE }}
          WOFFU_LONGITUDE: ${{ secrets.WOFFU_LONGITUDE }}
          WOFFU_HOME_LATITUDE: ${{ secrets.WOFFU_HOME_LATITUDE }}
          WOFFU_HOME_LONGITUDE: ${{ secrets.WOFFU_HOME_LONGITUDE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Notify failure
        if: failure()
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MSG="❌ woffux auto-sign failed at $(TZ=Europe/Madrid date '+%H:%M %Z %Y-%m-%d')"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d text="${MSG}" > /dev/null
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
