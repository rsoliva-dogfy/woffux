name: Auto Sign

on:
  schedule:
    - cron: '0 16 * * 4'  # Thu 18:00 (UTC+2)
    - cron: '0 17 * * 4'  # Thu 18:00 (UTC+1)
    - cron: '12 11 * * 1,3'  # Mon-Wed 13:12 (UTC+2)
    - cron: '12 12 * * 1,3'  # Mon-Wed 13:12 (UTC+1)
    - cron: '12 6 * * 5'  # Fri 08:12 (UTC+2)
    - cron: '12 7 * * 5'  # Fri 08:12 (UTC+1)
    - cron: '13 11 * * 4'  # Thu 13:13 (UTC+2)
    - cron: '13 12 * * 4'  # Thu 13:13 (UTC+1)
    - cron: '21 6 * * 1,2'  # Mon-Tue 08:21 (UTC+2)
    - cron: '21 7 * * 1,2'  # Mon-Tue 08:21 (UTC+1)
    - cron: '25 12 * * 5'  # Fri 14:25 (UTC+2)
    - cron: '25 13 * * 5'  # Fri 14:25 (UTC+1)
    - cron: '27 6 * * 4'  # Thu 08:27 (UTC+2)
    - cron: '27 7 * * 4'  # Thu 08:27 (UTC+1)
    - cron: '32 11 * * 2'  # Tue 13:32 (UTC+2)
    - cron: '32 12 * * 2'  # Tue 13:32 (UTC+1)
    - cron: '34 11 * * 4'  # Thu 13:34 (UTC+2)
    - cron: '34 12 * * 4'  # Thu 13:34 (UTC+1)
    - cron: '38 11 * * 1,3'  # Mon-Wed 13:38 (UTC+2)
    - cron: '38 12 * * 1,3'  # Mon-Wed 13:38 (UTC+1)
    - cron: '42 6 * * 3'  # Wed 08:42 (UTC+2)
    - cron: '42 7 * * 3'  # Wed 08:42 (UTC+1)
    - cron: '47 15 * * 1'  # Mon 17:47 (UTC+2)
    - cron: '47 16 * * 1'  # Mon 17:47 (UTC+1)
    - cron: '59 11 * * 2'  # Tue 13:59 (UTC+2)
    - cron: '59 12 * * 2'  # Tue 13:59 (UTC+1)
    - cron: '59 15 * * 2'  # Tue 17:59 (UTC+2)
    - cron: '59 16 * * 2'  # Tue 17:59 (UTC+1)
    - cron: '8 16 * * 3'  # Wed 18:08 (UTC+2)
    - cron: '8 17 * * 3'  # Wed 18:08 (UTC+1)
    - cron: '7,22,37,52 7-19 * * 1,2,3,4,5'  # catch-up every 15m (UTC+1)
    - cron: '7,22,37,52 6-18 * * 1,2,3,4,5'  # catch-up every 15m (UTC+2)
  workflow_dispatch:


concurrency:
  group: sign
  cancel-in-progress: true

jobs:
  sign:
    name: Sign in Woffu
    runs-on: ubuntu-latest
    steps:

      - name: Download woffux
        run: |
          curl -fsSL "https://github.com/ngavilan-dogfy/woffux/releases/latest/download/woffux-linux-amd64" -o woffux
          chmod +x woffux

      - name: Random delay
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 90 + 1 ))

      - name: Sign
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ./woffux sign --catch-up '1:08:21:in;1:13:12:out;1:13:38:in;1:17:47:out;2:08:21:in;2:13:32:out;2:13:59:in;2:17:59:out;3:08:42:in;3:13:12:out;3:13:38:in;3:18:08:out;4:08:27:in;4:13:13:out;4:13:34:in;4:18:00:out;5:08:12:in;5:14:25:out' --catch-up-timezone 'Europe/Madrid' --catch-up-window '2h'
          else
            ./woffux sign
          fi
        env:
          WOFFU_URL: ${{ secrets.WOFFU_URL }}
          WOFFU_COMPANY_URL: ${{ secrets.WOFFU_COMPANY_URL }}
          WOFFU_EMAIL: ${{ secrets.WOFFU_EMAIL }}
          WOFFU_PASSWORD: ${{ secrets.WOFFU_PASSWORD }}
          WOFFU_LATITUDE: ${{ secrets.WOFFU_LATITUDE }}
          WOFFU_LONGITUDE: ${{ secrets.WOFFU_LONGITUDE }}
          WOFFU_HOME_LATITUDE: ${{ secrets.WOFFU_HOME_LATITUDE }}
          WOFFU_HOME_LONGITUDE: ${{ secrets.WOFFU_HOME_LONGITUDE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Notify failure
        if: failure()
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MSG="❌ woffux auto-sign failed at $(TZ=Europe/Madrid date '+%H:%M %Z %Y-%m-%d')"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d text="${MSG}" > /dev/null
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
